# Temporary Label Studio (SQLite + local files on a dedicated RWO disk)
# Apply:   kubectl apply -f app-deploy.yaml
# If a Deployment with the same name already exists:
#          kubectl -n webapp-pre delete deploy label-studio
#
# StatefulSet creates PVC data-label-studio-0 (ReadWriteOnce). On EKS this
# is typically an EBS volume attached to one node and usable only by
# label-studio-0.
---
apiVersion: v1
kind: Namespace
metadata:
  name: webapp-pre
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: label-studio
  namespace: webapp-pre
  labels:
    app.kubernetes.io/name: label-studio
data:
  DJANGO_DB: "sqlite"
  JSON_LOG: "1"
  # Browser hits Cloudflare HTTPS; Cloudflare Flexible forwards HTTP to ALB.
  # HOST / CSRF must match the public URL the browser sees (https).
  LABEL_STUDIO_HOST: "https://label-studio.pyromind.ai"
  CSRF_TRUSTED_ORIGINS: "https://label-studio.pyromind.ai"
  # Trust X-Forwarded-Proto when it is https (Cloudflare Full + ALB TLS).
  # Flexible mode: ALB overwrites this to http; CSRF_TRUSTED_ORIGINS above
  # still allows the browser Origin https://label-studio.pyromind.ai.
  SECURE_PROXY_SSL_HEADER: "HTTP_X_FORWARDED_PROTO,https"
  USE_X_FORWARDED_HOST: "true"
  # Do not honor X-Forwarded-Port: ALB sends 80, which would make Django
  # treat the host as label-studio.pyromind.ai:80 and break CSRF.
  USE_X_FORWARDED_PORT: "false"
  SESSION_COOKIE_SECURE: "0"
  CSRF_COOKIE_SECURE: "0"
  # All-in-one process has no nginx sidecar; app serves uploads itself.
  USE_NGINX_FOR_UPLOADS: "false"
  USE_NGINX_FOR_EXPORT_DOWNLOADS: "false"
  LOCAL_FILES_SERVING_ENABLED: "true"
  # Import/serve root. In the UI, Absolute local path must be a subdirectory,
  # e.g. /label-studio/data/files
  LOCAL_FILES_DOCUMENT_ROOT: "/label-studio/data"
---
apiVersion: v1
kind: Secret
metadata:
  name: label-studio
  namespace: webapp-pre
  labels:
    app.kubernetes.io/name: label-studio
type: Opaque
stringData:
  # Persist across pod restarts so sessions/CSRF tokens stay valid.
  SECRET_KEY: "ls-pre-pyromind-webapp-pre-change-me-to-a-long-random-string"
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: label-studio
  namespace: webapp-pre
  labels:
    app.kubernetes.io/name: label-studio
spec:
  replicas: 1
  serviceName: label-studio
  updateStrategy:
    type: RollingUpdate
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Retain
  selector:
    matchLabels:
      app.kubernetes.io/name: label-studio
  template:
    metadata:
      labels:
        app.kubernetes.io/name: label-studio
    spec:
      enableServiceLinks: false
      securityContext:
        runAsUser: 1001
        runAsNonRoot: true
        fsGroup: 1001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: prepare-data
          image: heartexlabs/label-studio:latest
          imagePullPolicy: IfNotPresent
          command: ["sh", "-c", "mkdir -p /label-studio/data/files"]
          securityContext:
            runAsUser: 1001
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /label-studio/data
      containers:
        - name: app
          image: heartexlabs/label-studio:latest
          imagePullPolicy: IfNotPresent
          args: ["label-studio"]
          envFrom:
            - configMapRef:
                name: label-studio
            - secretRef:
                name: label-studio
          ports:
            - name: http
              containerPort: 8080
          securityContext:
            runAsUser: 1001
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /label-studio/data
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 180
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          readinessProbe:
            httpGet:
              path: /version
              port: http
            initialDelaySeconds: 90
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          app.kubernetes.io/name: label-studio
      spec:
        accessModes:
          - ReadWriteOnce
        # Cluster has no default StorageClass (PVC showed STORAGECLASS <unset>).
        # Confirm with: kubectl get sc
        storageClassName: gp3
        resources:
          requests:
            storage: 50Gi
---
apiVersion: v1
kind: Service
metadata:
  name: label-studio
  namespace: webapp-pre
  labels:
    app.kubernetes.io/name: label-studio
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: label-studio
  ports:
    - name: http
      port: 80
      targetPort: http
