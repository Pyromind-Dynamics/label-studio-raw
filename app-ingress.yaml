apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: label-studio-ingress-pre
  namespace: webapp-pre
  labels:
    app: label-studio
    env: pre
  annotations:
    kubernetes.io/ingress.class: alb
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    # ALB TLS 通过 ACM 证书配置，不使用 spec.tls
    # alb.ingress.kubernetes.io/certificate-arn: arn:aws:acm:region:account-id:certificate/xxxx
    # alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}, {"HTTPS": 443}]'
    # alb.ingress.kubernetes.io/ssl-redirect: "443"
spec:
  ingressClassName: alb
  rules:
  - host: label-studio.pyromind.ai
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: label-studio
            port:
              number: 80
